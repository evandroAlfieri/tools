<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorecard Summary Converter</title>
<style>
  :root {
    --bg: #f6f6f7;
    --panel: #ffffff;
    --border: #dcdde0;
    --text: #1f2328;
    --text-muted: #62666c;
    --accent: #2f6f5e;
    --accent-hover: #24564a;
    --fail-bg: #fdf1f0;
    --fail-border: #e6b3ae;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.45;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
  }
  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fbfbfc;
    color: var(--text);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  button {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { background: #f0f0f1; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  input[type="file"] { display: none; }
  .file-label {
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
  }
  .file-label:hover { background: #f0f0f1; }
  .status {
    font-size: 13px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .error {
    color: #9b2c26;
    font-size: 13.5px;
    margin-top: 10px;
    display: none;
  }
  #results { display: flex; flex-direction: column; gap: 16px; }
  .block-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .block-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .block-title {
    font-weight: 600;
    font-size: 14.5px;
  }
  .block-meta {
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 10px 18px 0;
  }
  .tab {
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    background: #f0f0f1;
    color: var(--text-muted);
    cursor: pointer;
  }
  .tab.active {
    background: var(--panel);
    color: var(--text);
  }
  .tab-panel {
    display: none;
    border-top: 1px solid var(--border);
  }
  .tab-panel.active { display: block; }
  .tab-panel pre {
    margin: 0;
    padding: 16px 18px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 480px;
    overflow: auto;
  }
  .markdown-help { margin: 12px 18px 8px; font-size: 12px; color: var(--text-muted); }
  .markdown-editor { display: block; width: calc(100% - 36px); margin: 0 18px 16px; min-height: 360px; line-height: 1.6; tab-size: 2; }
  .markdown-editor:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .block-actions {
    display: flex;
    gap: 8px;
    padding: 12px 18px 16px;
    border-top: 1px solid var(--border);
  }
  .empty-state {
    color: var(--text-muted);
    font-size: 13.5px;
    text-align: center;
    padding: 30px 10px;
  }
  .pv-body {
    padding: 18px;
    font-size: 13.5px;
  }
  .pv-h1 {
    font-size: 16px;
    margin: 0 0 10px;
  }
  .pv-meta {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .pv-meta strong { color: var(--text); font-weight: 600; }
  .pv-intro {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 18px;
  }
  /* A heading directly above a table: its underline sits right on top of the table's header row (no white band). */
  .pv-h2:has(+ table) { margin-bottom: 0; }
  .pv-h2 {
    font-size: 13.5px;
    font-weight: 600;
    margin: 20px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .certification-warning { padding: 12px 14px; border: 1px solid var(--fail-border); border-radius: 6px; background: var(--fail-bg); color: #9b2c26; }
  .pv-body blockquote, .print-doc blockquote { margin: 14px 0; padding: 10px 14px; border-left: 3px solid var(--fail-border); background: var(--fail-bg); }
  .pv-body blockquote p, .print-doc blockquote p { margin: 0; }
  .pv-none { color: var(--text-muted); }
  .pv-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .pv-table th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  .pv-table td {
    padding: 6px 8px;
    border-bottom: 1px solid #eeeeef;
    vertical-align: baseline; /* first text line of every cell lines up, whatever its font size */
  }
  .pv-table tr.sub-row td.sub-name {
    color: var(--text-muted);
    padding-left: 22px;
  }
  .cat-table { table-layout: fixed; }
  .cat-table col.c-cat { width: 25%; }
  .cat-table col.c-status { width: 11%; }
  .cat-table col.c-desc { width: 64%; }
  .pv-table td.desc { font-size: 12px; line-height: 1.45; color: #45484d; }
  /* Status icon; its text label is visually hidden (kept for screen readers and copy-paste). */
  .st { position: relative; display: inline-block; line-height: 1; white-space: nowrap; }
  .st svg { display: inline-block; width: 16px; height: 16px; vertical-align: -3.08px; }
  .st-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .pv-head { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; margin-bottom: 14px; }
  .pv-head .pv-meta { margin-bottom: 0; }
  .pv-legend { font-size: 12px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .pv-legend-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px; }
  .pv-legend-item { display: flex; align-items: flex-start; gap: 8px; margin-top: 5px; line-height: 1.4; }
  .pv-table thead th { background: #e8eaed; color: #3c4043; border-bottom: 1px solid #d5d8dc; }
  .pv-table tr.parent-row td { font-weight: 600; background: #f6f6f7; }
  .pv-table tr.parent-row td.desc { font-weight: 400; }
  .pv-note { font-size: 12px; color: var(--text-muted); font-style: italic; margin: 10px 0 0; }
  .pv-note a { color: inherit; word-break: break-all; }
  .see-details {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }

  #printArea { display: none; }
  .print-doc { padding: 8px 4px; }

    .print-doc .pv-table { font-size: 9pt; }

    .print-doc .pv-table td.desc { font-size: 8pt; }
    .print-doc .st svg { width: 11pt; height: 11pt; vertical-align: -2.1pt; }
    .print-doc .pv-legend { font-size: 8.5pt; padding: 7px 10px; }
    .print-doc .pv-legend-title { font-size: 7.5pt; }
    .print-doc .pv-legend-item { margin-top: 3px; gap: 6px; }
    .print-doc .pv-note { font-size: 8.5pt; break-before: avoid; page-break-before: avoid; }
    .print-doc .pv-h2.page-break { break-before: page; page-break-before: always; margin-top: 0; }
    .print-doc .see-details { font-size: 8pt; margin-top: 2px; }
    .print-doc tr, .print-doc blockquote, .print-doc pre, .print-doc li { break-inside: avoid; page-break-inside: avoid; }
    .print-doc h1, .print-doc h2, .print-doc h3, .print-doc h4 { break-after: avoid; page-break-after: avoid; break-inside: avoid; }
    .print-doc thead { display: table-header-group; }
    .print-doc p { orphans: 3; widows: 3; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 30px;
  }

<body>
<div class="wrap">
  <h1>Scorecard Summary Converter</h1>
  <p class="subtitle">Paste or upload a raw scorecard export. Get back the PASS / NO EVIDENCE / FAILING summary, as text and Markdown.</p>

  <div class="panel">
    <h2>Source export</h2>
    <textarea id="sourceInput" placeholder="Paste the raw scorecard export text here..."></textarea>
    <div class="controls">
      <label class="file-label" for="fileInput">Choose file…</label>
      <input type="file" id="fileInput" accept=".txt">
      <button class="primary" id="convertBtn">Convert</button>
      <button id="clearBtn">Clear</button>
      <span class="status" id="statusText"></span>
    </div>
    <div class="error" id="errorText"></div>
  </div>

  <div id="results">
    <div class="empty-state">No results yet. Paste or upload an export, then click Convert.</div>
  </div>

  <footer>Runs entirely in your browser — nothing is uploaded anywhere.</footer>
</div>

<div id="printArea"></div>

<script>
// ---------- Conversion logic ----------

const STATUS_MAP = {

  "not applicable": "NO EVIDENCE",
  "fail": "FAIL",
  "warning": "WARNING",
};

// Category descriptions, verbatim from buildingSMART/ifc-gherkin-rules docs/fixtures/functional_parts.json (main).
const CATEGORY_DESCRIPTIONS = {
  SYNTAX: "STEP Physical File syntax.",
  SCHEMA: "IFC schema referenced in the file, including formal propositions and functions encoded in the EXPRESS schema language.",
  IFC: "Complementary checks to the schema validation, considered prerequisites or fundamental for a valid IFC file. At the moment includes checks on: the validity of the IFC schema version; and the absence of deprecated concepts.",
  ANN: "The ability to add annotations to elements and spaces, such as labels, notes, and dimensions.",
  ASM: "The ability to model elements composed of / constructed by other elements. For example, a roof might be assembled from a series of prefabricated truss components.",
  BLT: "The ability to model various building and infrastructure elements, including walls, floors, roofs, stairs, doors, windows, columns, road pavements, bridge decks, railway track elements, etc.",
  CLS: "The ability to classify elements, materials, and systems according to various classification systems, such as the UNIFORMAT or Omniclass classification systems.",
  CST: "The ability to assign costing information to objects.",
  CTR: "The ability to model constraints on building elements, such as minimum and maximum dimensions or clearances, and to enforce these constraints during design and construction.",
  CTX: "The ability to assign colour, texture and other presentation appearance information to objects.",
  DOC: "The ability to associate reference to documentation to objects.",
  GEM: "The ability to represent built elements and spaces using various geometry types, including parametric, mesh, and voxel-based representations.",
  GRF: "The ability to accurately define the geographic location and orientation of the model relative to a reference coordinate system, such as a national or global coordinate system. ",
  GRP: "The ability to group objects related by functional or logical criteria. Used, for example to model building systems, such as HVAC (heating, ventilation, and air conditioning) systems; to group assets that have the same maintenance schedule; to group all terminals of a fire-protection system.",
  LAY: "The ability to assign layers (also known as, CAD layer) to collection of elements. This is used mainly for grouping and visibility control, and in general to organise geometry into groups that may be shown or hidden.",
  LIB: "The ability to associate library entities, such as from a product library or external database to objects and object types.",
  MAT: "The ability to define materials assigned to elements.",
  OJP: "The ability to define the location, orientation, and scale of built elements and systems within the building model.",
  OJT: "The ability to define elements (and unfortunately not systems) based on their type or function within the model, allowing reusability of information by the occurrence of such types.",
  POR: "The ability to define ports (as means for an element to connect to other elements) and the relationship that is made between two ports.",
  POS: "The ability to define (virtual) objects that are used to position other elements relatively. Includes grids, alignments, and referents.",

  PSE: "The ability to define properties of elements and systems, such as their performance characteristics.",
  QTY: "The ability to define quantities of elements, such as their dimensions, volume, area, weight.",
  SDL: "The ability to assign scheduling information to objects.",

  STR: "The ability to define structural members and structural connections, as analysis idealizations of built elements. And the ability to define actions (such as forces, displacements, etc.) and reactions (support reactions, internal forces, deflections, etc.) associated to structural items and specified by using the basic load definitions.",

  VRT: "The ability to model special elements providing imaginary, placeholder, or provisional areas (e.g. clearance), volumes, and boundaries.",

  AXG: "This involves representing the geometry using a set of axes, where each axis consists of a position in 3D space and a direction vector. This can be useful for representing geometry that follows a certain pattern or direction, such as walls, beams, columns, or other elements. In IFC, axis geometry can be represented using the IfcCartesianPoint and IfcDirection classes, which define the position and direction of the axes, respectively.",

  SWE: "This involves taking a 2D shape (often called the \"profile\") and moving it along a 3D path, generating a 3D shape. The resulting shape is typically smooth and continuous, with its cross-section changing gradually along the length of the path. Sweep geometry can be useful for representing a variety of objects, such as pipes, cables, and architectural details like moldings. In IFC, sweep geometry can be represented using the IfcExtrudedAreaSolid, IfcRevolvedAreaSolid, and IfcSweptAreaSolid entities.",
  TAS: "This involves representing geometry using a collection of interconnected vertices, edges, and faces, which are used to approximate a smooth surface. Tessellated geometry can be useful for representing organic or irregular shapes, or for creating low-resolution representations of more complex geometry. In IFC, tessellated geometry can be represented using a range of different mesh types, such as triangular, quadrilateral, or polyhedral meshes.",
  TFM: "Transformation geometry involves representing geometry using spatial transformations, such as rotations, translations, and scaling. It allows for the modification of existing geometry without the need to create new geometry from scratch. Transformation geometry can be used to represent various types of transformations, including cartesian transformations, placement transformations, and composite transformations, among others. These transformations can be applied to a range of geometric entities, including points, curves, surfaces, and solids, to create new or modified geometry. In IFC, transformation geometry is represented using the IfcCartesianTransformationOperator and IfcObjectPlacement entities.",
};

function describe(code) {
  return CATEGORY_DESCRIPTIONS[code] || "";
}

const CANONICAL_FUNCTIONAL = [
  ["ANN", "Annotations"],
  ["ASM", "Assemblies"],
  ["BLT", "Built elements"],
  ["CLS", "Classification reference"],
  ["CST", "Costing"],
  ["CTR", "Constraints"],
  ["CTX", "Presentation Colours & Textures"],
  ["DOC", "Documentation reference"],
  ["GEM", "Geometry representation"],
  ["GRF", "Georeferencing"],
  ["GRP", "Groups"],
  ["LAY", "Presentation layer"],
  ["LIB", "Library reference"],
  ["MAT", "Materials"],
  ["OJP", "Object placement"],
  ["OJT", "Objects typing"],
  ["PJS", "Project definition"],
  ["POR", "Ports Connectivity & Nesting"],
  ["POS", "Positioning elements"],
  ["PSE", "Properties for object"],
  ["QTY", "Quantities for objects"],
  ["SDL", "Scheduling of activities"],
  ["SPA", "Spaces"],
  ["SPS", "Spatial breakdown"],
  ["STR", "Structural items and actions"],
  ["VER", "Versioning & Revision Control"],
  ["VRT", "Virtual elements"],
];

const CANONICAL_SUBCATEGORIES = {
  "GEM": [
    ["ALS", "Alignment geometry"],
    ["AXG", "Axis geometry"],
    ["BBX", "Bounding box"],
    ["BRP", "Boundary Representation (BREP)"],
    ["CPD", "Clipped representations"],
    ["CSG", "Constructive Solid Geometry (CSG)"],
    ["MPD", "Mapped geometry"],
    ["PBG", "Point-based geometry"],
    ["RCO", "Relational constructs"],
    ["SWE", "Sweeps (i.e. extrusions, lofts, blends)"],
    ["TAS", "Tessellated (i.e. meshes)"],
    ["TFM", "Transformations"],
  ],
  "OJP": [
    ["GDP", "Grid placement"],
    ["LIP", "Linear placement"],
    ["LOP", "Local placement"],
  ],
  "POS": [
    ["ALB", "Alignment"],
    ["GRD", "Grid"],
    ["RFT", "Referent"],
  ],
};

const CATEGORY_CODE_RE = /^[A-Z]{2,}$/;
const EQ_LINE_RE = /^=+$/;

function splitBlocks(fullText) {
  const lines = fullText.replace(/\r\n/g, "\n").split("\n");
  const eqPositions = [];
  lines.forEach((l, i) => {
    const t = l.trim();
    if (EQ_LINE_RE.test(t) && t.length >= 10) eqPositions.push(i);
  });

  const blocks = [];
  let i = 0;
  while (i + 1 < eqPositions.length) {
    const start = eqPositions[i];
    const headerEnd = eqPositions[i + 1];
    const headerLines = lines.slice(start, headerEnd + 1);
    const bodyStart = headerEnd + 1;
    const bodyEnd = (i + 2 < eqPositions.length) ? eqPositions[i + 2] : lines.length;
    const bodyLines = lines.slice(bodyStart, bodyEnd);
    blocks.push({ headerLines, bodyLines });
    i += 2;
  }
  return blocks;
}

function parseFailingRules(lines) {
  const rules = [];
  const path = [];
  for (const raw of lines) {
    const match = raw.match(/^(\s*)(.+?):\s*(.+)$/);
    if (!match) continue;
    const indent = match[1].replace(/\t/g, "    ").length;
    const name = match[2].trim();
    const value = match[3].trim();
    while (path.length && path[path.length - 1].indent >= indent) path.pop();
    const code = name.split(" ")[0];
    if (CATEGORY_CODE_RE.test(code)) {
      path.push({ indent, name });
    } else if (/^fail(?:\s|$)/i.test(value)) {
      const count = value.match(/\((\d+)\)/);
      rules.push({ name, category: path.map(p => p.name).join(" / "), count: count ? count[1] : "—" });
    }
  }
  return rules;
}

function markdownCell(value) {
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\|/g, "&#124;").replace(/\r?\n/g, " ");
}

const RULE_CATALOG_URL = "https://buildingsmart.github.io/ifc-gherkin-rules/branches/main/features/index.html";
const RULE_CATALOG_TEXT = "For the full list of Validation Service rules, see the rule catalog:";
const RULES_POINTER = "The Failing rules table on the next page lists each rule that failed, with its reported count.";

function listNames(names) {
  return names.length < 2 ? names.join("") : names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}
function subpartsPointer(withSubs) {
  return `The Subparts table on the next page breaks down ${listNames(withSubs.map(c => c.name))} into their subparts.`;
}

function rulesMarkdown(rules) {
  return ["## Failing rules", "", ...(rules.length ? [
    "| Rule | Functional Part | Reported count |",
    "|---|---|---|",
    ...rules.map(r => `| ${markdownCell(r.name)} | ${markdownCell(r.category)} | ${r.count} |`)
  ] : ["None"]), "", `${RULE_CATALOG_TEXT} [${RULE_CATALOG_URL}](${RULE_CATALOG_URL})`, ""];
}

function normalizeSubs(subs, code) {
  const canon = CANONICAL_SUBCATEGORIES[code];
  if (!canon) return subs;

  const byCode = {};
  subs.forEach(s => { byCode[s.code] = s; });

  const merged = [];
  const seen = new Set();
  for (const [c, n] of canon) {
    seen.add(c);
    if (byCode[c]) merged.push(byCode[c]);
    else merged.push({ code: c, name: n, status: "not applicable" });
  }
  const extras = Object.keys(byCode)
    .filter(c => !seen.has(c))
    .sort()
    .map(c => byCode[c]);
  return merged.concat(extras);
}

function normalizeCategories(categories) {
  const byCode = {};
  categories.forEach(c => {
    if (c.code !== "SYNTAX" && c.code !== "SCHEMA") byCode[c.code] = c;
  });
  const syntax = categories.find(c => c.code === "SYNTAX") || null;
  const schema = categories.find(c => c.code === "SCHEMA") || null;
  if (schema) schema.subs = [];

  const merged = [];
  const seen = new Set();
  for (const [code, name] of CANONICAL_FUNCTIONAL) {
    seen.add(code);
    if (byCode[code]) merged.push(byCode[code]);
    else merged.push({ code, name, status: "not applicable", subs: [] });
  }
  const extras = Object.keys(byCode)
    .filter(code => !seen.has(code))
    .sort()
    .map(code => byCode[code]);
  merged.push(...extras);

  merged.forEach(cat => {
    cat.subs = normalizeSubs(cat.subs, cat.code);
  });

  const result = [];
  if (syntax) result.push(syntax);
  if (schema) result.push(schema);
  return result.concat(merged);
}

function parseBlock(headerLines, bodyLines) {
  const info = {};
  headerLines.forEach(line => {
    if (line.includes(":") && !line.trim().startsWith("=")) {
      const idx = line.indexOf(":");
      const k = line.slice(0, idx).trim();
      const v = line.slice(idx + 1).trim();
      info[k] = v;
    }
  });

  const categories = [];
  let currentTop = null;

  for (const raw of bodyLines) {
    if (!raw.trim()) continue;
    const indent = raw.length - raw.replace(/^ +/, "").length;
    const level = Math.floor(indent / 4);
    const content = raw.trim();
    if (!content.includes(":")) continue;
    const idx = content.indexOf(":");
    const left = content.slice(0, idx).trim();
    const right = content.slice(idx + 1).trim();

    const spaceIdx = left.indexOf(" ");
    const code = spaceIdx === -1 ? left : left.slice(0, spaceIdx);

    if (!CATEGORY_CODE_RE.test(code)) continue; // leaf rule / fail-detail -> dropped

    const name = spaceIdx === -1 ? code : left.slice(spaceIdx + 1);
    const status = right.split(" (")[0].trim();

    if (level === 0) {
      currentTop = { code, name, status, subs: [] };
      categories.push(currentTop);
    } else if (level === 1) {
      if (!currentTop) continue;
      currentTop.subs.push({ code, name, status });
    }
    // level 2 = leaf under subcategory, already excluded above
  }

  if (categories.length === 0) {
    return { info, categories: [] };
  }
  return { info, categories: normalizeCategories(categories) };
}

function label(code, name) {
  if (code.toUpperCase() === name.toUpperCase()) return name;
  if (name.toLowerCase().includes(`(${code})`.toLowerCase())) return name;
  return `${name} (${code})`;
}

const SUBPARTS_NOTE = "see Subparts table";

// withSubs=false: parent line only, with a pointer to the Subparts section.
// withSubs=true: parent line followed by its subparts (used in the Subparts section).
function renderCategoryBlockText(cat, withSubs = false) {
  const lines = [];
  const suffix = (!withSubs && cat.subs.length) ? ` (${SUBPARTS_NOTE})` : "";
  lines.push(`- ${label(cat.code, cat.name)}: ${STATUS_MAP[cat.status] || cat.status.toUpperCase()}${suffix}`);
  if (withSubs) cat.subs.forEach(sub => {
    lines.push(`  - ${label(sub.code, sub.name)}: ${STATUS_MAP[sub.status] || sub.status.toUpperCase()}`);
  });
  lines.push("");
  return lines;
}

const CERTIFICATION_WARNING = "Software certification cannot be completed until all reported errors have been resolved. See the Failing rules section at the end of this report for details.";

function hasErrors(categories) {
  return categories.some(cat => cat.status === "fail" || cat.subs.some(sub => sub.status === "fail"));
}

function renderText(headerLines, categories, rules = []) {
  const out = [];
  out.push(...headerLines);
  out.push("");
  out.push(
    "Based on the IFC files observed as of the Last Data Refresh date indicated " +
    "above, the following summarises the IFC features supported by the evaluated " +
    "Application."
  );
  out.push("");
  out.push("");

  const passing = [];
  const failing = [];

  categories.forEach(cat => {
    const block = renderCategoryBlockText(cat);
    (cat.status === "fail" ? failing : passing).push(...block);
  });

  out.push("FAILING");
  out.push("-------");
  out.push("");
  out.push(...(failing.length ? failing : ["None"]));
  if (hasErrors(categories) || rules.length) out.push("", "WARNING: " + CERTIFICATION_WARNING, "");
  out.push("", "PASSING or NO EVIDENCE", "----------------------", "", ...passing, "");
  const withSubs = categories.filter(cat => cat.subs.length);
  if (withSubs.length) out.push("SUBPARTS", "--------", "", ...withSubs.flatMap(cat => renderCategoryBlockText(cat, true)));

  out.push("FAILING RULES", "-------------", "", ...(rules.length ? rules.map(r => `- ${r.name} | ${r.category} | Reported count: ${r.count}`) : ["None"]), "", `${RULE_CATALOG_TEXT} ${RULE_CATALOG_URL}`, "");
  return out.join("\n");
}

function renderCategoryRowsMd(cat, withSubs = false) {
  const rows = [];
  const note = (!withSubs && cat.subs.length) ? ` *(${SUBPARTS_NOTE})*` : "";
  rows.push(`| ${markdownCell(label(cat.code, cat.name))}${note} | ${STATUS_MAP[cat.status] || cat.status.toUpperCase()} | ${markdownCell(describe(cat.code))} |`);
  if (withSubs) cat.subs.forEach(sub => {
    rows.push(`| &nbsp;&nbsp;↳ ${markdownCell(label(sub.code, sub.name))} | ${STATUS_MAP[sub.status] || sub.status.toUpperCase()} | ${markdownCell(describe(sub.code))} |`);
  });
  return rows;
}

function renderMarkdown(info, categories, rules = []) {
  const out = [];
  out.push("# Scorecard Summary");
  out.push("");
  Object.entries(info).forEach(([k, v]) => {
    out.push(`**${k}:** ${v}  `);
  });
  out.push("");
  out.push(
    "Based on the IFC files observed as of the Last Data Refresh date indicated " +
    "above, the following summarises the IFC features supported by the evaluated " +
    "Application."
  );
  out.push("");

  const passing = [];
  const failing = [];
  categories.forEach(cat => {
    const rows = renderCategoryRowsMd(cat);
    (cat.status === "fail" ? failing : passing).push(...rows);
  });

  out.push("");
  out.push("## Failing");
  out.push("");
  if (!failing.length) {
    out.push("None");
  } else {
    out.push("| Functional Part | Support | Description |");
    out.push("|---|---|---|");
    out.push(...failing);
  }
  out.push("");

  if (hasErrors(categories) || rules.length) out.push("> **Warning:** " + CERTIFICATION_WARNING, "");
  out.push("## Passing or No Evidence", "", "| Functional Part | Support | Description |", "|---|---|---|", ...passing, "");
  const withSubs = categories.filter(cat => cat.subs.length);
  if (withSubs.length) out.push(`*${subpartsPointer(withSubs)}*`, "", "## Subparts", "", "| Functional Part | Support | Description |", "|---|---|---|", ...withSubs.flatMap(cat => renderCategoryRowsMd(cat, true)), "");
  if (rules.length) out.push(`*${RULES_POINTER}*`, "");
  out.push(...rulesMarkdown(rules));
  return out.join("\n");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// Status icons, styled after the Validation Service legend: green tick, red exclamation, amber warning triangle;
// grey dash for "no evidence".
const STATUS_ICONS = {
  pass: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#dcf1e4"/><circle cx="8" cy="8" r="5" fill="#2e9e5b"/><path d="M5.6 8.1l1.6 1.6 3.2-3.3" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fail: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#f9d2d2"/><circle cx="8" cy="8" r="5" fill="#d93a3a"/><path d="M8 5.3v3.3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="10.7" r="0.85" fill="#fff"/></svg>',
  warning: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#fdf1c4"/><path d="M8 2.6l5.6 10H2.4z" fill="#f5c400" stroke="#f5c400" stroke-width="1" stroke-linejoin="round"/><path d="M8 6.4v3" stroke="#5a4500" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11" r="0.75" fill="#5a4500"/></svg>',
  na: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#eeeeef"/><circle cx="8" cy="8" r="5" fill="#a3a6ab"/><path d="M5.7 8h4.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>',
};

// Tables show the icon only; the label stays in the markup (visually hidden) for screen readers, tooltips and copy-paste.
function statusHtml(kind, text) {
  return `<span class="st st-${kind}" title="${text}">${STATUS_ICONS[kind]}<span class="st-label">${text}</span></span>`;
}

const STATUS_LEGEND = [
  ["pass", "PASS", "Consistently valid in the evaluated IFC files."],
  ["fail", "FAIL", "Not consistently valid in the evaluated IFC files."],
  ["warning", "WARNING", "Valid, but some industry best practices may have warnings. The tool is still compliant with IFC."],
  ["na", "NO EVIDENCE", "Not observed in the evaluated IFC files. No judgment can be made."],
];

function legendHtml() {
  return `<div class="pv-legend"><div class="pv-legend-title">Legend</div>${STATUS_LEGEND.map(([kind, text, desc]) =>
    `<div class="pv-legend-item">${statusHtml(kind, text)}<span>${desc}</span></div>`).join("")}</div>`;
}

function statusIconHtml(status) {
  const text = STATUS_MAP[status] || status.toUpperCase();
  const kind = status === "pass" ? "pass"
    : status === "fail" ? "fail"
    : status === "warning" ? "warning"
    : "na";
  return statusHtml(kind, text);
}

function pushCategoryRowsHtml(cat, rows, withSubs = false) {
  const note = (!withSubs && cat.subs.length) ? ` <span class="see-details">(${SUBPARTS_NOTE})</span>` : "";
  rows.push(`<tr${withSubs ? ' class="parent-row"' : ""}><td>${escapeHtml(label(cat.code, cat.name))}${note}</td><td>${statusIconHtml(cat.status)}</td><td class="desc">${escapeHtml(describe(cat.code))}</td></tr>`);
  if (withSubs) cat.subs.forEach(sub => {
    rows.push(`<tr class="sub-row"><td class="sub-name">↳ ${escapeHtml(label(sub.code, sub.name))}</td><td>${statusIconHtml(sub.status)}</td><td class="desc">${escapeHtml(describe(sub.code))}</td></tr>`);
  });
}

function renderPreviewHtml(info, categories, rules = []) {
  let html = "";
  html += `<h1 class="pv-h1">Scorecard Summary</h1>`;
  html += `<div class="pv-head"><div class="pv-meta">`;
  Object.entries(info).forEach(([k, v]) => {
    html += `<div><strong>${escapeHtml(k)}:</strong> ${escapeHtml(v)}</div>`;
  });
  html += `</div>${legendHtml()}</div>`;
  html += `<p class="pv-intro">Based on the IFC files observed as of the Last Data Refresh date indicated above, the following summarises the IFC features supported by the evaluated Application.</p>`;

  html += `<h2 class="pv-h2">Failing</h2>`;
  const failRows = [];
  categories.forEach(cat => { if (cat.status === "fail") pushCategoryRowsHtml(cat, failRows); });
  if (failRows.length === 0) {
    html += `<p class="pv-none">None</p>`;
  } else {
    html += `<table class="pv-table cat-table"><colgroup><col class="c-cat"><col class="c-status"><col class="c-desc"></colgroup><thead><tr><th>Functional Part</th><th>Support</th><th>Description</th></tr></thead><tbody>${failRows.join("")}</tbody></table>`;
  }
  if (hasErrors(categories) || rules.length) html += `<blockquote class="certification-warning"><strong>Warning:</strong> ${CERTIFICATION_WARNING}</blockquote>`;
  html += `<h2 class="pv-h2">Passing or No Evidence</h2>`;
  const passRows = [];
  categories.forEach(cat => { if (cat.status !== "fail") pushCategoryRowsHtml(cat, passRows); });
  html += `<table class="pv-table cat-table"><colgroup><col class="c-cat"><col class="c-status"><col class="c-desc"></colgroup><thead><tr><th>Functional Part</th><th>Support</th><th>Description</th></tr></thead><tbody>${passRows.join("")}</tbody></table>`;

  const withSubs = categories.filter(cat => cat.subs.length);
  const subRows = [];
  withSubs.forEach(cat => pushCategoryRowsHtml(cat, subRows, true));
  if (subRows.length) html += `<p class="pv-note">${escapeHtml(subpartsPointer(withSubs))}</p><h2 class="pv-h2 page-break">Subparts</h2><table class="pv-table cat-table"><colgroup><col class="c-cat"><col class="c-status"><col class="c-desc"></colgroup><thead><tr><th>Functional Part</th><th>Support</th><th>Description</th></tr></thead><tbody>${subRows.join("")}</tbody></table>`;

  if (rules.length) html += `<p class="pv-note">${RULES_POINTER}</p>`;
  html += `<h2 class="pv-h2${rules.length ? " page-break" : ""}">Failing rules</h2>`;
  html += rules.length ? `<table class="pv-table"><thead><tr><th>Rule</th><th>Functional Part</th><th>Reported count</th></tr></thead><tbody>${rules.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.category)}</td><td>${r.count}</td></tr>`).join("")}</tbody></table>` : '<p class="pv-none">None</p>';
  html += `<p class="pv-note">${RULE_CATALOG_TEXT} <a href="${RULE_CATALOG_URL}" rel="noopener noreferrer">${RULE_CATALOG_URL}</a></p>`;
  return html;
}

function safeSlug(...parts) {
  let s = parts.filter(Boolean).join("_");
  s = s.replace(/[^\w\-.]+/g, "_");
  return s.replace(/^_+|_+$/g, "");
}

function convertFullText(fullText) {
  const blocks = splitBlocks(fullText);
  const results = [];
  blocks.forEach(({ headerLines, bodyLines }) => {
    const { info, categories } = parseBlock(headerLines, bodyLines);
    if (categories.length === 0) return; // empty block, skip

    const rules = parseFailingRules(bodyLines);
    const text = renderText(headerLines, categories, rules);
    const md = renderMarkdown(info, categories, rules);

    const vsv = info["Validation Service Version"] || "";
    const schema = info["IFC Schema Version"] || "";
    const selfiles = info["Selected File(s)"] || "";
    const app = info["Application"] || "scorecard";

    const fnameBase = safeSlug(app, `vsv${vsv}`, schema, `${selfiles}files`);
    const previewHtml = renderPreviewHtml(info, categories, rules);
    results.push({ info, text, md, previewHtml, fnameBase });
  });
  return results;
}

// ---------- UI wiring ----------

const sourceInput = document.getElementById("sourceInput");
const fileInput = document.getElementById("fileInput");
const convertBtn = document.getElementById("convertBtn");
const clearBtn = document.getElementById("clearBtn");
const statusText = document.getElementById("statusText");
const errorText = document.getElementById("errorText");
const resultsEl = document.getElementById("results");

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    sourceInput.value = reader.result;
    statusText.textContent = `Loaded ${file.name}`;
  };
  reader.onerror = () => {
    showError("Could not read that file. Try pasting the content instead.");
  };
  reader.readAsText(file);
});

clearBtn.addEventListener("click", () => {
  sourceInput.value = "";
  fileInput.value = "";
  statusText.textContent = "";
  hideError();
  renderEmptyState();
});

convertBtn.addEventListener("click", () => {
  hideError();
  const text = sourceInput.value;
  if (!text.trim()) {
    showError("Paste or upload a source export first.");
    return;
  }
  let results;
  try {
    results = convertFullText(text);
  } catch (e) {
    showError("Something went wrong while parsing this file. Check that it's an unmodified scorecard export.");
    console.error(e);
    return;
  }
  if (results.length === 0) {
    showError("No valid scorecard blocks were found in this text. Check that this is a raw scorecard export.");
    renderEmptyState();
    return;
  }
  statusText.textContent = `${results.length} block${results.length > 1 ? "s" : ""} converted`;
  renderResults(results);
});

function showError(msg) {
  errorText.textContent = msg;
  errorText.style.display = "block";
}
function hideError() {
  errorText.style.display = "none";
  errorText.textContent = "";
}

function renderEmptyState() {
  resultsEl.innerHTML = '<div class="empty-state">No results yet. Paste or upload an export, then click Convert.</div>';
}


function renderEditedMarkdown(markdown) {
  const template = document.createElement("template");
  template.innerHTML = marked.parse(markdown, { gfm: true, breaks: true });
  const allowed = new Set(["H1", "H2", "H3", "H4", "H5", "H6", "P", "BR", "HR", "STRONG", "EM", "DEL", "BLOCKQUOTE", "UL", "OL", "LI", "PRE", "CODE", "TABLE", "THEAD", "TBODY", "TR", "TH", "TD", "A"]);
  for (const element of [...template.content.querySelectorAll("*")].reverse()) {
    if (["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "SVG", "MATH"].includes(element.tagName)) {
      element.remove();
      continue;
    }
    if (!allowed.has(element.tagName)) {
      element.replaceWith(...element.childNodes);
      continue;
    }
    const href = element.getAttribute("href");
    for (const attr of [...element.attributes]) element.removeAttribute(attr.name);
    if (element.tagName === "A" && href && /^(https?:|mailto:|#)/i.test(href.trim())) {
      element.setAttribute("href", href);
      element.setAttribute("rel", "noopener noreferrer");
    }
    if (element.tagName === "TABLE") element.className = "pv-table";
    if (element.tagName === "H1") element.className = "pv-h1";
    if (element.tagName === "H2") element.className = "pv-h2";
  }
  // Restore scorecard styling after sanitizing the edited Markdown.
  for (const cell of template.content.querySelectorAll("tbody td:nth-child(2)")) {
    const walker = document.createTreeWalker(cell, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);
    for (const node of textNodes) {
      // Older labels (NOT SUPPORTED, NO EVIDENCE OF SUPPORT) are still recognised, so earlier Markdown exports keep working.
      const match = node.textContent.match(/^(\s*)(NO EVIDENCE OF SUPPORT|NO EVIDENCE|NOT SUPPORTED|WARNING|PASS|FAIL)(?=\s|$)/);
      if (!match) continue;
      const kinds = { PASS: "pass", FAIL: "fail", WARNING: "warning", "NO EVIDENCE": "na", "NO EVIDENCE OF SUPPORT": "na", "NOT SUPPORTED": "na" };
      const holder = document.createElement("template");
      holder.innerHTML = statusHtml(kinds[match[2]], match[2]);
      node.replaceWith(document.createTextNode(match[1]), holder.content.firstChild, document.createTextNode(node.textContent.slice(match[0].length)));
      break;
    }
  }
  for (const row of template.content.querySelectorAll("tbody tr")) {
    const name = row.querySelector("td");
    if (name && name.textContent.trim().startsWith("↳")) {
      row.className = "sub-row";
      name.className = "sub-name";
    }
  }
  // Functional part tables (Functional Part | Support | Description): same column layout as the generated preview.
  for (const table of template.content.querySelectorAll("table")) {
    const heads = [...table.querySelectorAll("thead th")].map(th => th.textContent.trim().toLowerCase());
    if (!["category|status|description", "functional part|status|description", "functional part|support|description"].includes(heads.join("|"))) continue;
    table.classList.add("cat-table");
    table.insertAdjacentHTML("afterbegin", '<colgroup><col class="c-cat"><col class="c-status"><col class="c-desc"></colgroup>');
    for (const td of table.querySelectorAll("tbody td:nth-child(3)")) td.className = "desc";
    for (const em of table.querySelectorAll("tbody td:nth-child(1) em, tbody td:nth-child(2) em")) {
      if (/^\(see /i.test(em.textContent.trim())) em.className = "see-details";
    }
  }
  // In a table that has subpart rows, the other rows are their parents: style them as group headers.
  for (const table of template.content.querySelectorAll("table.cat-table")) {
    if (!table.querySelector("tr.sub-row")) continue;
    for (const row of table.querySelectorAll("tbody tr:not(.sub-row)")) row.className = "parent-row";
  }
  // Metadata block (first paragraph that starts with a bold "Key:") gets the legend beside it.
  const metaPara = [...template.content.querySelectorAll("p")].find(p => p.firstElementChild && p.firstElementChild.tagName === "STRONG" && /:\s*$/.test(p.firstElementChild.textContent) && p.firstChild === p.firstElementChild);
  if (metaPara) {
    const head = document.createElement("div");
    head.className = "pv-head";
    metaPara.replaceWith(head);
    metaPara.className = "pv-meta";
    head.appendChild(metaPara);
    head.insertAdjacentHTML("beforeend", legendHtml());
  }
  // Page breaks before Subparts and Failing rules (Failing rules only when it has a table).
  for (const h2 of template.content.querySelectorAll("h2")) {
    const title = h2.textContent.trim().toLowerCase();
    const next = h2.nextElementSibling;
    if (title === "subparts" || (title === "failing rules" && next && next.tagName === "TABLE")) h2.classList.add("page-break");
  }
  for (const para of template.content.querySelectorAll("p")) {
    if (/^(The Subparts table on the next page|The Failing rules table on the next page|For the full list of Validation Service rules)/.test(para.textContent.trim())) para.className = "pv-note";
  }
  for (const quote of template.content.querySelectorAll("blockquote")) {
    if (/^Warning:/i.test(quote.textContent.trim())) quote.className = "certification-warning";
  }
  return template.innerHTML;
}

function renderResults(results) {
  resultsEl.innerHTML = "";
  results.forEach((r, idx) => {
    const info = r.info;
    const card = document.createElement("div");
    card.className = "block-card";

    const metaBits = [];
    if (info["Validation Service Version"]) metaBits.push(`Validation Service ${info["Validation Service Version"]}`);
    if (info["IFC Schema Version"]) metaBits.push(info["IFC Schema Version"]);
    if (info["Selected File(s)"]) metaBits.push(`${info["Selected File(s)"]} file(s)`);

    card.innerHTML = `
      <div class="block-head">
        <div class="block-title">${escapeHtml(info["Application"] || "Scorecard")}${info["Company"] ? " — " + escapeHtml(info["Company"]) : ""}</div>
        <div class="block-meta">${escapeHtml(metaBits.join(" · "))}</div>
      </div>
      <div class="tabs">
        <div class="tab active" data-tab="text">Text</div>
        <div class="tab" data-tab="md">Markdown</div>
        <div class="tab" data-tab="preview">Preview</div>
      </div>
      <div class="tab-panel active" data-panel="text"><pre></pre></div>
      <div class="tab-panel" data-panel="md"><p class="markdown-help">Edit Markdown below. Copy and Download .md include your changes. Preview and PDF update automatically. Text retains the original summary. Converting again replaces your edits.</p><textarea class="markdown-editor" aria-label="Edit Markdown summary" spellcheck="false"></textarea></div>
      <div class="tab-panel" data-panel="preview"><div class="pv-body"></div></div>
      <div class="block-actions">
        <button data-action="copy">Copy</button>
        <button data-action="download-txt">Download .txt</button>
        <button data-action="download-md">Download .md</button>
        <button data-action="export-pdf" title="Opens your browser's print dialog — set the destination to &quot;Save as PDF&quot;">Save as PDF</button>
      </div>
    `;

    card.querySelector('[data-panel="text"] pre').textContent = r.text;
    const markdownEditor = card.querySelector('[data-panel="md"] textarea');
    markdownEditor.value = r.md;
    markdownEditor.addEventListener("input", () => {
      r.md = markdownEditor.value;
      r.previewHtml = renderEditedMarkdown(r.md);
      card.querySelector('[data-panel="preview"] .pv-body').innerHTML = r.previewHtml;
    });
    card.querySelector('[data-panel="preview"] .pv-body').innerHTML = r.previewHtml;

    const tabs = card.querySelectorAll(".tab");
    const panels = card.querySelectorAll(".tab-panel");
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        panels.forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        card.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add("active");
      });
    });

    card.querySelector('[data-action="copy"]').addEventListener("click", (e) => {
      const activeTab = card.querySelector(".tab.active").dataset.tab;
      const content = activeTab === "text" ? r.text : r.md; // preview copies the markdown source
      navigator.clipboard.writeText(content).then(() => {
        const btn = e.target;
        const original = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    });

    card.querySelector('[data-action="download-txt"]').addEventListener("click", () => {
      downloadFile(r.fnameBase + ".txt", r.text, "text/plain");
    });
    card.querySelector('[data-action="download-md"]').addEventListener("click", () => {
      downloadFile(r.fnameBase + ".md", r.md, "text/markdown");
    });
    card.querySelector('[data-action="export-pdf"]').addEventListener("click", () => {
      exportPdf(r);
    });

    resultsEl.appendChild(card);
  });
}

const printArea = document.getElementById("printArea");
const DEFAULT_TITLE = document.title;

function exportPdf(r) {
  printArea.innerHTML = `<div class="print-doc">${r.previewHtml}</div>`;
  document.title = r.fnameBase;
  window.print();
}

window.addEventListener("afterprint", () => {
  document.title = DEFAULT_TITLE;
  printArea.innerHTML = "";
});

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
