<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Travel Expense Manager</title><meta name="description" content="Organize business travel receipts, review expenses, and export reimbursement reports in euros."><link rel="stylesheet" href="style.css"></head>
<body><aside><a class="brand" href="#"><span class="mark">↗</span><span>Travel Expense<br><strong>Manager</strong></span></a><div class="side-label">YOUR WORKSPACE</div><nav><button data-view="overview">◫ <span>Trip overview</span></button><button data-view="receipts">▤ <span>Receipts & review</span><b id="reviewBadge"></b></button><button data-view="rates">⇄ <span>Exchange rates</span></button><button data-view="reports">↓ <span>Reports & exports</span></button></nav><div class="side-bottom"><div class="privacy-dot"></div><strong>Private by design</strong><p>Receipts stay in this browser.<br>Export a backup to keep them safe.</p><button id="backup" class="side-action">Back up all trips ↗</button><button id="restore" class="side-action">Restore a backup ↗</button><input type="file" id="restoreFile" accept="application/json,.json" hidden></div></aside>
<div class="workspace"><header><span>BUSINESS TRAVEL / EXPENSES</span><div><label class="sr" for="tripSelect">Current trip</label><select id="tripSelect"></select><button class="secondary small" id="newTrip">+ New trip</button></div></header><main id="main"></main><footer>Made for your next trip. <span>Local storage · No receipt uploads to a server</span></footer></div>
<dialog id="tripDialog"><form id="tripForm"><div class="eyebrow">TRIP DETAILS</div><h2 id="tripDialogTitle">Where are you headed?</h2><label>Trip name<input name="name" placeholder="e.g. London client meetings" required maxlength="100"></label><div class="two"><label>Start date<input name="start" type="date" required></label><label>End date<input name="end" type="date" required></label></div><label>Business purpose<input name="purpose" placeholder="e.g. Quarterly client review" maxlength="300"></label><label>Traveler<input name="traveler" placeholder="Your name" maxlength="100"></label><div class="actions"><button type="button" class="secondary" id="cancelTrip">Cancel</button><button class="primary">Save trip</button></div></form></dialog>
<dialog id="receiptDialog"><div id="receiptEditor"></div></dialog><div id="toast" role="status"></div><div id="busy" hidden role="status"><div class="spinner"></div><strong id="busyTitle">Processing receipts</strong><p id="busyText">Preparing...</p></div>
<input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff,image/*,application/pdf" hidden>
<script src="vendor/pdf-lib.min.js"></script><script src="vendor/tesseract.min.js"></script><script type="module" src="app.js?v=2"></script></body></html>
